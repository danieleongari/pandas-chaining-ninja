name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pandas:
          - latest
          - "2.3"
          - "2.2"
          - "2.1"
          - "2.0"
          - "1.5"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ipython pytest

          if [ "${{ matrix.pandas }}" = "latest" ]; then
            pip install pandas
          elif [ "${{ matrix.pandas }}" = "1.5" ] || [ "${{ matrix.pandas }}" = "2.0" ]; then
            pip install "numpy~=1.0" "pandas~=${{ matrix.pandas }}.0"
          else
            pip install "pandas~=${{ matrix.pandas }}.0"
          fi

      - name: Show versions
        run: |
          python - <<'EOF'
          import pandas, numpy, sys
          print("python:", sys.version)
          print("pandas:", pandas.__version__)
          print("numpy:", numpy.__version__)
          EOF

      - name: Run tests
        run: pytest -s
